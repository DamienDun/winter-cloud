# Tomcat
server:
  port: 9300
  tomcat:
    # 大文件分片上传：单连接请求体上限（需大于 spring.servlet.multipart.max-request-size）
    max-swallow-size: 100MB
    max-http-form-post-size: 100MB

# Spring
spring:
  application:
    # 应用名称
    name: winter-file
  profiles:
    # 环境配置
    active: dev
  servlet:
    multipart:
      enabled: true
      # 默认 1MB；前端分片 5~20MB，后端默认分片 10MB，这里放宽到 100MB
      max-file-size: 100MB
      max-request-size: 100MB
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 127.0.0.1:8848
      config:
        # 配置中心地址
        server-addr: 127.0.0.1:8848
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
